project:
  name: real_time_od
  task: detect

classes:
  - Vehicle

datasets:
  VisDrone:
    model_dir: models/VisDrone
  Top-View-Vehicle-Detection:
    model_dir: models/Top-View-Vehicle-Detection-Yolov8n-P2

models:
  definitions:
    yolov8n:
      type: ultralytics
      source: yolov8n.pt
    yolov8s:
      type: ultralytics
      source: yolov8s.pt
    yolov8n-p2:
      type: project
      config: configs/models/yolov8n-p2.yaml
      transfer_from: yolov8n.pt

inference:
  source: 0
  imgsz: 640
  conf: 0.25
  iou: 0.7
  device:

kaggle:
  data: /kaggle/working/top_view_vehicle.yaml
  dataset_name: Top-View-Vehicle-Detection
  project: /kaggle/working/runs
  export_dir: /kaggle/working/export
  train:
    epochs: 100
    imgsz: 640
    batch: 16
    workers: 4
    device: 0,1
